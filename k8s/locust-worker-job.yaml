# The pods that actually generate load: each is a separate OS process
# running the same locustfile.py, connecting directly to Atlas with the
# real BENCH_MONGO_URI secret. See the "distributed mode" note in
# benchmarks/locustfile.py for why each worker safely allocates its own,
# non-colliding range of seq values without needing to coordinate with the
# others -- this is what makes it safe to just change `parallelism`.
#
# A Job (not a Deployment) because a worker's locust process exits on its
# own once the master shuts down at the end of a headless run -- a
# Deployment would see that as a crash and restart it forever.
#
# requests == limits (Guaranteed QoS): with requests < limits (Burstable),
# GKE Autopilot's bin-packing/consolidation pass can evict these pods
# mid-run to repack nodes -- seen in practice as all workers getting a
# kubelet-initiated SIGTERM and the sweep ending early with no error of our
# own. Guaranteed QoS pods are the last to be considered for that kind of
# eviction.
#
# backoffLimit: 3, not 0 -- QoS class doesn't protect against scheduler
# *preemption* (a separate mechanism from eviction/consolidation), which
# happens in practice during concurrent Autopilot node scale-up: a
# higher-priority system pod can preempt one of ours to land on a node
# that's still coming up. With backoffLimit: 0, that single transient
# preemption failed the entire 8-pod Job even though the other 7 workers
# were healthy. A few retries lets Kubernetes replace just the preempted
# pod instead.
apiVersion: batch/v1
kind: Job
metadata:
  name: locust-worker
  labels:
    app: locust
    role: worker
spec:
  parallelism: 4
  completions: 4
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: locust
        role: worker
    spec:
      restartPolicy: Never
      containers:
        - name: locust-worker
          image: locust-mongo-bench:latest  # replace with your pushed image, e.g. gcr.io/<project>/locust-mongo-bench:latest
          args: ["--worker", "--master-host=locust-master"]
          envFrom:
            - configMapRef:
                name: locust-config
            - secretRef:
                name: locust-secrets
          resources:
            requests:
              cpu: "2"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "1Gi"
